name: CI/CD Pipeline

on:
    push:
        branches:
            - master

permissions:
    id-token: write
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v2

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Grant execute permission
              run: chmod +x gradlew

            - name: Run tests
              run: ./gradlew test

            - name: Build application
              run: ./gradlew clean bootJar

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ap-south-2

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Verify Dockerfile
              run: pwd ls -la cat Dockerfile

            - name: Build Docker image
              run: docker build -t ecommerce-backend:${{ github.sha }} .

            - name: Tag Docker image
              run: docker tag ecommerce-backend:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/ecommerce-backend:${{ github.sha }}

            - name: Push Docker image to Amazon ECR
              run: docker push ${{ steps.login-ecr.outputs.registry }}/ecommerce-backend:${{ github.sha }}

            - name: Deploy to EC2
              run: aws ssm send-command --instance-ids "i-03fc42a6ce2b5b9fe" --document-name "AWS-RunShellScript" \
                  --parameters 'commands=[
                  "aws ecr get-login-password --region ap-south-2 | sudo docker login --username AWS --password-stdin 877133239377.dkr.ecr.ap-south-2.amazonaws.com",
                  "sudo docker pull 877133239377.dkr.ecr.ap-south-2.amazonaws.com/ecommerce-backend:${{ github.sha }}",
                  "sudo docker stop ecommerce-backend || true",
                  "sudo docker rm ecommerce-backend || true",
                  "sudo docker run -d --name ecommerce-backend --env-file /opt/ecommerce/.env -p 80:8080 877133239377.dkr.ecr.ap-south-2.amazonaws.com/ecommerce-backend:${{ github.sha }}"
                  ]' --region ap-south-2
