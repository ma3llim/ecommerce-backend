plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = "org.ecommerce"
version = "1.0.0"

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // model mapper
    implementation 'org.modelmapper:modelmapper:3.2.6'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // JWT (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'
    // Postgresql
    runtimeOnly 'org.postgresql:postgresql'
    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    // Cloudinary
    implementation 'com.cloudinary:cloudinary-http5:2.3.0'
    // image detected
    implementation 'org.apache.tika:tika-core:3.2.2'
    // razorpay
    implementation 'com.razorpay:razorpay-java:1.4.8'
    // actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // bucket4j
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.19.0'
    implementation 'com.bucket4j:bucket4j_jdk17-redis-common:8.19.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.19.0'
    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Lombok for tests
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // Database H2 for testing
    testRuntimeOnly 'com.h2database:h2'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.ecommerce.EcommerceApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}